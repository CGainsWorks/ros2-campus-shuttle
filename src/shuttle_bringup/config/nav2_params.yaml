# Nav2 parameters for the campus shuttle.
#
# The controller_server registers BOTH shuttle controllers as plugins.
# `controller_plugins` lists them, so switching between them at runtime is a
# matter of which plugin id the behaviour tree asks for. The default is
# FollowPath -> Pure Pursuit; set it to StanleyPath to swap.
#
# The gains here are the ones written by `controller_bench --tune`; keep them in
# sync by re-running scripts/run_bench.sh, which copies tuned_gains.yaml next to
# this file.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    laser_model_type: likelihood_field
    max_particles: 2000
    min_particles: 500
    laser_max_range: 12.0
    laser_min_range: 0.16
    update_min_a: 0.15
    update_min_d: 0.20
    resample_interval: 1
    transform_tolerance: 0.5
    # The global EKF owns map -> odom, so AMCL must not also publish it.
    tf_broadcast: false
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered

    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath", "StanleyPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "shuttle_control/PurePursuitController"
      max_speed: 1.0
      max_lon_accel: 0.8
      max_lat_accel: 0.8
      min_moving_speed: 0.15
      goal_tolerance: 0.25
      max_omega: 1.5
      search_window: 120
      control_period: 0.05
      lookahead_gain: 0.65
      lookahead_base: 0.0
      lookahead_min: 0.15
      lookahead_max: 3.0

    StanleyPath:
      plugin: "shuttle_control/StanleyController"
      max_speed: 1.0
      max_lon_accel: 0.8
      max_lat_accel: 0.8
      min_moving_speed: 0.15
      goal_tolerance: 0.25
      max_omega: 1.5
      search_window: 120
      control_period: 0.05
      k_e: 1.5
      k_soft: 0.05
      front_axle_distance: 0.3
      max_steer: 1.0
      k_damp: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.55
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.55
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    max_velocity: [1.0, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]
    max_accel: [0.8, 0.0, 3.0]
    max_decel: [-0.8, 0.0, -3.0]
    odom_topic: /odometry/filtered

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "campus_map.yaml"

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
