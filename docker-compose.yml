# `docker compose up` reproduces every result in this repository.
#
# The default service builds the small toolchain image and runs the whole
# pipeline: the controller unit tests, the scenario geometry cross-check, the
# parameter file validation, the camera-to-LiDAR calibration, the controller
# tuning and full comparison matrix, the figures and docs/RESULTS.md and then
# verifies that every expected artifact actually exists and is not empty. It
# needs no ROS, no Gazebo and no GPU and takes a couple of minutes.
#
# The heavier simulation services are opt-in via profiles, because building the
# ROS 2 Jazzy and Gazebo Harmonic image is a multi-gigabyte download that is not
# needed to check the numbers.

services:

  # --- default: everything, verified --------------------------------------
  bench:
    build:
      context: .
      dockerfile: docker/Dockerfile.bench
    image: ros2-campus-shuttle/bench:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["bash", "scripts/run_all.sh"]

  # Just the controller comparison, without the tests and calibration.
  comparison:
    build:
      context: .
      dockerfile: docker/Dockerfile.bench
    image: ros2-campus-shuttle/bench:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["bash", "scripts/run_bench.sh"]

  # --- camera-to-LiDAR calibration ----------------------------------------
  calibration:
    build:
      context: .
      dockerfile: docker/Dockerfile.bench
    image: ros2-campus-shuttle/bench:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["bash", "scripts/run_calibration.sh"]

  # --- everything the bench image can check -------------------------------
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.bench
    image: ros2-campus-shuttle/bench:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["bash", "scripts/run_tests.sh"]

  # --- full ROS 2 Jazzy + Gazebo Harmonic stack (opt in) -------------------
  # docker compose --profile sim run --rm sim
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ros2-campus-shuttle/sim:local
    profiles: ["sim"]
    working_dir: /ws
    volumes:
      - .:/ws
    environment:
      - ROS_DOMAIN_ID=42
      # The Gazebo server runs headless with offscreen rendering by default;
      # set DISPLAY and pass headless:=false for the GUI.
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    command: ["bash"]

  # Gazebo cross-check of the comparison: three repeats of `corner` at 1 m/s,
  # summarised into docs/RESULTS_GAZEBO.md and results/controller_comparison.json.
  # docker compose --profile sim run --rm gazebo-comparison
  gazebo-comparison:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ros2-campus-shuttle/sim:local
    profiles: ["sim"]
    working_dir: /ws
    volumes:
      - .:/ws
    environment:
      - ROS_DOMAIN_ID=42
      - LIBGL_ALWAYS_SOFTWARE=1
    command: ["bash", "scripts/run_gazebo_repeats.sh", "3", "corner", "1.0"]
