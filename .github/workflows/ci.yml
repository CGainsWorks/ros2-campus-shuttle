name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Everything that does not need ROS. This is the job that guards the headline
  # result, and it runs in about a minute.
  core:
    name: Controller core, geometry and calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3-numpy python3-scipy \
            python3-matplotlib python3-pandas python3-yaml

      # Deliberately the same entry point the README tells a reader to run, so
      # CI cannot drift away from the documented command. It builds from
      # source, runs every check, regenerates the results and then verifies the
      # artifacts exist and that all 84 runs finished cleanly.
      - name: Full pipeline (scripts/run_all.sh)
        run: bash scripts/run_all.sh

      # The benchmark is deterministic, so regenerating on a clean checkout must
      # reproduce the committed results exactly. If this fails, either the
      # committed artifacts are stale or something has become non-reproducible.
      - name: Committed results are reproducible
        run: |
          if ! git diff --exit-code --stat -- \
              docs/RESULTS.md analysis/figures calibration/extrinsics.yaml \
              src/shuttle_bringup/config/tuned_gains.yaml; then
            echo "::error::regenerating changed committed artifacts; " \
                 "re-run scripts/run_all.sh and commit the result"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-results
          path: |
            results/bench/metrics.csv
            docs/RESULTS.md
            analysis/figures

  # The ROS 2 workspace. Build and lint only; the Gazebo comparison is too heavy
  # for CI and is run locally via scripts/run_comparison.sh.
  ros:
    name: colcon build (Humble)
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro humble || true

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --return-code-on-test-failure
          colcon test-result --verbose

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 --max-line-length 100 analysis src tests
